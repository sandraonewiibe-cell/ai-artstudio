<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI ART STUDIO — Admin</title>

    <!--
      Styles inline rather than in style.css: that sheet dresses the three
      kiosk screens, and this is a form nobody at the exhibition ever sees.
      Keeping them apart means nothing here can affect what is on the wall.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 2rem 1.25rem 4rem;
        font: 15px/1.5 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #14161a;
        color: #e8e9ec;
      }

      main { max-width: 780px; margin: 0 auto; }

      h1 { font-size: 1.4rem; margin: 0 0 1.75rem; letter-spacing: .04em; }
      h2 { font-size: 1rem; margin: 0 0 1rem; letter-spacing: .06em; text-transform: uppercase; color: #9aa2b1; }

      section {
        background: #1c1f25;
        border: 1px solid #2a2f38;
        border-radius: 10px;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
      }

      .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
      .row + .row { margin-top: 1rem; }

      label { display: block; font-size: .8rem; color: #9aa2b1; margin-bottom: .3rem; }

      input[type="number"], select {
        background: #14161a;
        border: 1px solid #333a45;
        border-radius: 6px;
        color: #e8e9ec;
        padding: .5rem .6rem;
        font: inherit;
        min-width: 7rem;
      }

      input[type="file"] { font: inherit; color: #9aa2b1; max-width: 100%; }

      .toggle { display: flex; align-items: center; gap: .5rem; }
      .toggle input { width: 1.1rem; height: 1.1rem; }
      .toggle label { margin: 0; color: #e8e9ec; font-size: .95rem; }

      .side { flex: 1 1 300px; border: 1px solid #2a2f38; border-radius: 8px; padding: 1rem; }
      .side h3 { margin: 0 0 .85rem; font-size: .95rem; }

      .preview {
        margin-top: .75rem;
        min-height: 60px;
        display: flex;
        align-items: center;
        gap: .75rem;
        color: #6f7887;
        font-size: .85rem;
      }
      .preview img, .preview video { max-height: 60px; max-width: 160px; background: #0c0e11; border-radius: 4px; }

      ul.ads { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: .5rem; }
      ul.ads li {
        display: flex; align-items: center; gap: .75rem;
        background: #14161a; border: 1px solid #2a2f38; border-radius: 6px; padding: .5rem .75rem;
      }
      ul.ads img, ul.ads video { height: 44px; width: 68px; object-fit: cover; border-radius: 4px; background: #0c0e11; }
      ul.ads .name { flex: 1; font-size: .85rem; color: #9aa2b1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      ul.ads .order {
        min-width: 1.6rem; text-align: center; font-size: .8rem; color: #6f7887;
        border: 1px solid #2a2f38; border-radius: 4px; padding: .15rem 0;
      }
      ul.ads button { padding: .3rem .55rem; }
      ul.ads button:disabled { opacity: .35; cursor: default; }
      input[type="file"]:disabled { opacity: .4; }
      #adCount { color: #6f7887; }

      button {
        font: inherit; border-radius: 6px; padding: .5rem .9rem; cursor: pointer;
        background: #2a2f38; color: #e8e9ec; border: 1px solid #3a4150;
      }
      button:hover { background: #333a45; }
      button.primary { background: #2f6f4f; border-color: #3c8a63; }
      button.primary:hover { background: #37815c; }
      button.danger { background: transparent; border-color: #4a3238; color: #c98b96; }

      .bar {
        position: sticky; bottom: 0; margin-top: 1.5rem; padding: 1rem 0 0;
        display: flex; align-items: center; gap: 1rem;
        background: linear-gradient(to top, #14161a 65%, transparent);
      }

      .status { font-size: .85rem; color: #9aa2b1; min-height: 1.2em; }
      .status.is-error { color: #e08b95; }
      .status.is-good { color: #7fc79f; }
    </style>
  </head>
  <body>
    <main>
      <h1>AI ART STUDIO — Admin</h1>

      <section>
        <h2>Background</h2>
        <div class="row">
          <div style="flex: 1 1 260px">
            <label for="bgFile">Video behind everything <span id="bgLimit"></span></label>
            <input type="file" id="bgFile" accept="video/*" />
          </div>
        </div>
        <div class="preview" id="bgPreview"></div>
      </section>

      <section>
        <h2>Logos</h2>
        <div class="row">
          <div class="side">
            <h3>Left</h3>
            <div class="toggle">
              <input type="checkbox" id="leftEnabled" />
              <label for="leftEnabled">Show on the wall</label>
            </div>
            <div class="row" style="margin-top: .85rem">
              <div>
                <label for="leftSize">Height (% of screen)</label>
                <input type="number" id="leftSize" min="2" max="30" step="1" />
              </div>
              <div style="flex: 1 1 160px">
                <label for="leftFile">Image</label>
                <input type="file" id="leftFile" accept="image/*" />
              </div>
            </div>
            <div class="preview" id="leftPreview">No logo uploaded</div>
          </div>

          <div class="side">
            <h3>Right</h3>
            <div class="toggle">
              <input type="checkbox" id="rightEnabled" />
              <label for="rightEnabled">Show on the wall</label>
            </div>
            <div class="row" style="margin-top: .85rem">
              <div>
                <label for="rightSize">Height (% of screen)</label>
                <input type="number" id="rightSize" min="2" max="30" step="1" />
              </div>
              <div style="flex: 1 1 160px">
                <label for="rightFile">Image</label>
                <input type="file" id="rightFile" accept="image/*" />
              </div>
            </div>
            <div class="preview" id="rightPreview">No logo uploaded</div>
          </div>
        </div>
      </section>

      <section>
        <h2>Advertisements</h2>

        <div class="toggle">
          <input type="checkbox" id="adsEnabled" />
          <label for="adsEnabled">Show advertisements between boats</label>
        </div>

        <div class="row" style="margin-top: 1rem">
          <div>
            <label for="adPlacement">Placement</label>
            <select id="adPlacement">
              <option value="fullscreen">Full screen</option>
              <option value="top">Top strip</option>
              <option value="bottom">Bottom strip</option>
              <option value="left">Left panel</option>
              <option value="right">Right panel</option>
            </select>
          </div>
          <div>
            <label for="adDuration">Show for (seconds)</label>
            <input type="number" id="adDuration" min="1" max="120" step="1" />
          </div>
          <div>
            <label for="adGap">Then break for (seconds)</label>
            <input type="number" id="adGap" min="1" max="600" step="1" />
          </div>
          <div style="flex: 1 1 240px">
            <label for="adFile">Add images or videos <span id="adCount"></span></label>
            <input type="file" id="adFile" accept="image/*,video/*" multiple />
          </div>
        </div>

        <ul class="ads" id="adList"></ul>
      </section>

      <div class="bar">
        <button class="primary" id="save">Save and apply</button>
        <button id="reload">Discard changes</button>
        <span class="status" id="status"></span>
      </div>
    </main>

    <script type="module" src="admin.js"></script>
  </body>
</html>
